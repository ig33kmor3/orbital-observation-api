name: orbital-observation-demo

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: orbital_observation
      POSTGRES_USER: orbital
      POSTGRES_PASSWORD: orbital_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "orbital", "-d", "orbital_observation"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
